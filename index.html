<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>AI Companion TurtleBot</title>

    <style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: #f3f3f3;
    color: #444;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 30px;
}

.container {
    width: 900px;
    max-width: 100%;
    background: #ffffff;
    border-radius: 25px;
    padding: 30px;
    border-top: 8px solid #f4a62a;
    box-shadow: 0 12px 35px rgba(80, 80, 80, 0.15);
}

.navigation {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-bottom: 28px;
    flex-wrap: wrap;
}

.nav-button {
    display: inline-block;
    padding: 12px 24px;
    border-radius: 12px;
    text-decoration: none;
    font-weight: bold;
    color: #444;
    background: #fff4c7;
    border: 2px solid #f4c542;
    transition: 0.2s;
}

.nav-button:hover {
    transform: translateY(-2px);
    background: #ffe49a;
    box-shadow: 0 5px 12px rgba(0,0,0,0.12);
}

.microphone-page {
    background: #f4a62a;
    color: white;
    border-color: #f4a62a;
}

.manual-page {
    background: #fff4c7;
    color: #555;
    border-color: #f4c542;
}

.title {
    text-align: center;
    color: #444;
    font-size: 32px;
    font-weight: bold;
    margin-bottom: 8px;
}

.subtitle {
    text-align: center;
    color: #888;
    margin-bottom: 25px;
}

.robot {
    display: flex;
    justify-content: center;
    margin: 20px;
}

.robot-face {
    width: 220px;
    height: 150px;
    background: #eeeeee;
    border-radius: 45px;
    border: 5px solid #666;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 35px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.12);
}

.eye {
    width: 35px;
    height: 50px;
    background: #444;
    border-radius: 50%;
    border: 5px solid #f4c542;
}

.status {
    text-align: center;
    color: #777;
    margin: 15px 0;
    font-weight: bold;
}

.chat {
    background: #f7f7f7;
    border: 2px solid #eeeeee;
    border-radius: 20px;
    padding: 20px;
    min-height: 180px;
    max-height: 350px;
    overflow-y: auto;
}

.message {
    padding: 15px;
    margin: 10px 0;
    border-radius: 15px;
    max-width: 80%;
    line-height: 1.5;
}

.user {
    background: #fff0b8;
    margin-left: auto;
    text-align: right;
    border-right: 5px solid #f4c542;
}

.bot {
    background: #e5e5e5;
    border-left: 5px solid #f4a62a;
}

.controls {
    display: flex;
    justify-content: center;
    margin-top: 25px;
}

button {
    border: none;
    border-radius: 50%;
    width: 90px;
    height: 90px;
    font-size: 38px;
    cursor: pointer;
    background: #f4a62a;
    color: white;
    box-shadow: 0 8px 20px rgba(0,0,0,0.18);
    transition: 0.2s;
}

button:hover {
    transform: scale(1.05);
    background: #e89118;
}

button.listening {
    background: #f4c542;
    animation: pulse 1s infinite;
}

@keyframes pulse {
    0% {
        transform: scale(1);
    }
    50% {
        transform: scale(1.08);
    }
    100% {
        transform: scale(1);
    }
}

.hint {
    text-align: center;
    color: #888;
    margin-top: 15px;
}

@media (max-width: 600px) {
    body {
        padding: 15px;
    }

    .container {
        padding: 20px;
    }

    .title {
        font-size: 25px;
    }

    .robot-face {
        width: 190px;
        height: 130px;
    }

    .message {
        max-width: 90%;
    }
}
</style>

</head>


<body>


<div class="container">


    <!-- ==================================================
         WEBSITE NAVIGATION
         ================================================== -->

    <div class="navigation">

        <a href="/"
           class="nav-button microphone-page">

            🎙️ Microphone

        </a>


        <a href="manual.html"
           class="nav-button manual-page">

            📖 User Manual

        </a>

    </div>


    <!-- ==================================================
         TITLE
         ================================================== -->

    <div class="title">

        🤖 AI Companion TurtleBot

    </div>


    <div class="subtitle">

        Intelligent Voice Companion

    </div>


    <!-- ==================================================
         ROBOT FACE
         ================================================== -->

    <div class="robot">

        <div class="robot-face">

            <div class="eye"></div>

            <div class="eye"></div>

        </div>

    </div>


    <!-- ==================================================
         STATUS
         ================================================== -->

    <div class="status" id="status">

        Ready to talk

    </div>


    <!-- ==================================================
         CHAT
         ================================================== -->

    <div class="chat" id="chat">

    </div>


    <!-- ==================================================
         MICROPHONE BUTTON
         ================================================== -->

    <div class="controls">

        <button id="micButton">

            🎤

        </button>

    </div>


    <div class="hint">

        Click the microphone and start speaking

    </div>


</div>



<script>


// ==========================================================
// SPEECH RECOGNITION
// ==========================================================

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


const micButton =
    document.getElementById("micButton");


const status =
    document.getElementById("status");


const chat =
    document.getElementById("chat");


// ==========================================================
// CHECK BROWSER SUPPORT
// ==========================================================

if (!SpeechRecognition) {

    status.innerText =
        "Speech recognition is not supported. Please use Google Chrome.";

}


// Create speech recognition

const recognition =
    new SpeechRecognition();


recognition.lang =
    "en-US";


recognition.continuous =
    false;


recognition.interimResults =
    false;


// ==========================================================
// MICROPHONE BUTTON
// ==========================================================

micButton.onclick = function() {

    try {

        recognition.start();

    }

    catch (error) {

        console.log(error);

    }

};


// ==========================================================
// START LISTENING
// ==========================================================

recognition.onstart = function() {

    micButton.classList.add(
        "listening"
    );

    status.innerText =
        "🎤 Listening...";

};


// ==========================================================
// SPEECH RESULT
// ==========================================================

recognition.onresult = async function(event) {


    const text =
        event.results[0][0].transcript;


    micButton.classList.remove(
        "listening"
    );


    status.innerText =
        "🧠 Gemini is thinking...";


    // Show user message

    addMessage(
        text,
        "user"
    );


    // ======================================================
    // SEND TEXT TO LAPTOP
    // ======================================================

    try {

        const response =
            await fetch(
                "/chat",
                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                        "application/json"

                    },

                    body: JSON.stringify({

                        text: text

                    })

                }
            );


        const data =
            await response.json();


        // ==================================================
        // ERROR
        // ==================================================

        if (data.error) {

            status.innerText =
                "Error: " + data.error;

            return;

        }


        // ==================================================
        // SHOW TURTLEBOT RESPONSE
        // ==================================================

        addMessage(
            data.reply,
            "bot"
        );


        // ==================================================
        // TTS
        // ==================================================

        status.innerText =
            "🔊 TurtleBot is speaking through laptop speaker...";


        // Wait a little before ready

        setTimeout(

            function() {

                status.innerText =
                    "Ready to talk";

            },

            3000

        );


    }

    catch (error) {

        console.error(error);

        status.innerText =
            "Connection error.";

    }

};


// ==========================================================
// SPEECH END
// ==========================================================

recognition.onend = function() {

    micButton.classList.remove(
        "listening"
    );

};


// ==========================================================
// SPEECH ERROR
// ==========================================================

recognition.onerror = function(event) {

    micButton.classList.remove(
        "listening"
    );


    console.log(
        "Speech error:",
        event.error
    );


    status.innerText =
        "Microphone error: " +
        event.error;

};


// ==========================================================
// ADD CHAT MESSAGE
// ==========================================================

function addMessage(
    text,
    type
) {


    const message =
        document.createElement(
            "div"
        );


    message.className =
        "message " + type;


    message.innerText =
        text;


    chat.appendChild(
        message
    );


    chat.scrollTop =
        chat.scrollHeight;

}


</script>



<script>
document.addEventListener("DOMContentLoaded", function () {
    const oldMic = document.getElementById("micButton");

    if (oldMic) {
        const newMic = oldMic.cloneNode(true);

        newMic.disabled = true;
        newMic.style.cursor = "not-allowed";
        newMic.style.opacity = "0.65";
        newMic.title = "Voice interaction is available on the TurtleBot system.";

        newMic.onclick = function (event) {
            event.preventDefault();
            alert("🎙️ Voice interaction is available on the TurtleBot system.");
        };

        oldMic.replaceWith(newMic);
    }

    const hint = document.querySelector(".hint");

    if (hint) {
        hint.textContent = "Voice interaction is available on the TurtleBot system.";
    }
});
</script>

</body>

</html>
